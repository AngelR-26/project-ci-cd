name: PDF Tool - CI/CD

on:
  push:
    branches:
      - devops/ci-cd
  pull_request:
    branches:
      - devops/ci-cd
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-tool-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-release:
    name: Validate and prepare release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI/CD repository
        uses: actions/checkout@v4

      - name: Checkout PDF Tool source
        uses: actions/checkout@v4
        with:
          repository: AngelR-26/pdf-tool
          ref: master
          path: app

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        working-directory: app
        run: pnpm lint

      - name: Build Next.js application
        working-directory: app
        run: pnpm build

      - name: Build release Docker image
        run: node scripts/prepare-release.mjs

      - name: Smoke test release container
        run: node scripts/test-release.mjs

  deploy-production:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    needs: validate-and-release
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/devops/ci-cd'
    environment: production
    steps:
      - name: Checkout CI/CD repository
        uses: actions/checkout@v4

      - name: Checkout PDF Tool source
        uses: actions/checkout@v4
        with:
          repository: AngelR-26/pdf-tool
          ref: master
          path: app

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: node scripts/deploy-vercel.mjs
